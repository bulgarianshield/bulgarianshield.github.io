<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocsAccessHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.7/tailwind.min.css">
  
<style>
:root {
  --brand: #6d7dfc;
  --text: #1f2937;
  --muted: #6b7280;
}

body {
  margin: 0;
  background-color: #f7fafc;
  background-image: url("./background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
}

.card {
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.10);
  border: 1px solid rgba(255,255,255,0.55);
}

</style>
</head>

<body class="flex items-center justify-center px-4">


<main class="card w-full max-w-lg p-10 rounded-xl">
  <div class="flex items-center mb-10">
    <div class="w-10 h-10 mr-4 rounded-sm" style="background: var(--brand);"></div>
    <h1 class="text-2xl font-semibold" style="color: var(--text);">DocsAccessHub</h1>
  </div>

  <p class="text-sm uppercase tracking-widest font-semibold mb-4" style="color: var(--brand);">
    Public portal
  </p>

  <h2 class="text-5xl font-semibold leading-tight mb-6" style="color: var(--text);">
    Opening soon.
  </h2>

  <p class="text-lg mb-10" style="color: var(--muted);">
    Secure document access is being prepared.
  </p>

  <div class="flex space-x-2 mb-8">
    <div class="h-2 w-16 rounded-full" style="background: var(--brand);"></div>
    <div class="h-2 w-8 rounded-full" style="background: rgba(107,114,128,0.28);"></div>
    <div class="h-2 w-4 rounded-full" style="background: rgba(107,114,128,0.22);"></div>
  </div>

  <div class="text-sm" style="color: var(--muted);">
    <a href="/privacy/" class="hover:underline">Privacy Policy</a>
    <span class="mx-2">•</span>
    <a href="/terms/" class="hover:underline">Terms of Service</a>
  </div>
  
  </main>



</body>
</html>
