<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - DocsAccessHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.7/tailwind.min.css">

<style>
:root {
  --brand: #6d7dfc;
  --text: #1f2937;
  --muted: #6b7280;
}

body {
  margin: 0;
  background-color: #f7fafc;
  background-image: url("../background.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
}

.card {
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.10);
  border: 1px solid rgba(255,255,255,0.55);
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: #111827;
  color: white;
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body class="flex items-center justify-center px-4">

<main class="card w-full max-w-md p-10 rounded-xl">

  <h1 class="text-2xl font-semibold mb-2" style="color: var(--text);">
    Contact DocsAccessHub
  </h1>

  <p class="text-sm mb-6" style="color: var(--muted);">
    Tell us what files you want to share or how you want to use our service.
  </p>

  <form id="contactForm" class="space-y-4">

    <div>
      <label class="block text-sm mb-1" style="color: var(--muted);">Email address</label>
      <input type="email" required placeholder="you@company.com"
        class="w-full border rounded p-3 bg-white">
    </div>

    <div>
      <label class="block text-sm mb-1" style="color: var(--muted);">Request type</label>
      <select required class="w-full border rounded p-3 bg-white">
        <option value="">Select one</option>
        <option>Share files securely</option>
        <option>Request document access</option>
        <option>Business / team use</option>
        <option>Support question</option>
      </select>
    </div>

    <div>
      <label class="block text-sm mb-1" style="color: var(--muted);">Message</label>
      <textarea rows="4" required
        placeholder="Briefly describe what you need..."
        class="w-full border rounded p-3 bg-white"></textarea>
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAADFakPa9_E-A3PST"></div>

    <button type="submit"
      class="w-full py-3 rounded text-white font-semibold"
      style="background: var(--brand);">
      Submit request
    </button>

  </form>

  <div class="text-sm mt-8" style="color: var(--muted);">
    <a href="/" class="hover:underline">Home</a>
    <span class="mx-2">•</span>
    <a href="/privacy/" class="hover:underline">Privacy</a>
    <span class="mx-2">•</span>
    <a href="/terms/" class="hover:underline">Terms</a>
  </div>

</main>

<div id="toast" class="toast">
  Request submitted. We’ll get back to you shortly.
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const toast = document.getElementById("toast");
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);

  this.reset();
});
</script>

</body>
</html>
